<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Кабинет менеджера</title>
<link rel="stylesheet" href="admin.css">
<!-- Иконки грузятся, не задерживая показ страницы -->
<link rel="preload" href="../vendor/fa/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="../vendor/fa/css/all.min.css"></noscript>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
</head>
<body>

<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="login-logo"><i class="fas fa-utensils"></i></div>
    <h1>Кабинет менеджера</h1>
    <p class="muted">Обучение сотрудников «Южане»</p>
    <div id="loginWidget" class="login-widget"></div>
    <div id="loginError" class="login-error"></div>
    <p class="muted small" id="loginHint"></p>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i class="fas fa-utensils"></i><div><b>Южане</b><span>кабинет менеджера</span></div></div>
    <nav class="menu">
      <a href="#/" data-route="dashboard"><i class="fas fa-chart-pie"></i>Обзор</a>
      <a href="#/users" data-route="users"><i class="fas fa-users"></i>Сотрудники</a>
      <a href="#/results" data-route="results"><i class="fas fa-list-check"></i>Результаты</a>
      <div class="menu-label">Контент</div>
      <a href="#/content" data-route="content"><i class="fas fa-layer-group"></i>Блоки и тесты</a>
      <a href="#/refs" data-route="refs"><i class="fas fa-book-open"></i>Справочники</a>
      <div class="menu-label">Система</div>
      <a href="#/settings" data-route="settings"><i class="fas fa-gear"></i>Настройки</a>
    </nav>
    <div class="sidebar-foot">
      <div class="me" id="me"></div>
      <div class="sidebar-actions">
        <button class="icon-btn" id="themeBtn" title="Тема"><i class="fas fa-moon"></i></button>
        <button class="icon-btn" id="logoutBtn" title="Выйти"><i class="fas fa-arrow-right-from-bracket"></i></button>
      </div>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main">
    <div class="mobile-bar">
      <button class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      <b>Южане · кабинет</b>
      <span style="width:38px"></span>
    </div>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="../config.js" defer></script>
<script src="admin.js" defer></script>
</body>
</html>
