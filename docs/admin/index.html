<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Кабинет менеджера</title>
<link rel="stylesheet" href="admin.css?v=202611061323">
<link rel="stylesheet" href="../vendor/icons.css?v=202611061323">
</head>
<body>

<div id="login" class="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-logo"><i class="fas fa-utensils"></i></div>
    <h1 id="loginTitle">Кабинет менеджера</h1>
    <p class="muted" id="loginSub">Обучение сотрудников «Южане»</p>
    <div class="login-fields">
      <label class="field" data-step="login"><span>Логин</span>
        <input type="text" name="login" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="field" data-step="login"><span>Пароль</span>
        <input type="password" name="password" autocomplete="current-password"></label>
      <label class="check" data-step="login"><input type="checkbox" name="remember"> Не выходить</label>
      <label class="field" data-step="change" hidden><span>Новый пароль</span>
        <input type="password" name="new_password" autocomplete="new-password" placeholder="Не короче 6 символов"></label>
      <label class="field" data-step="change" hidden><span>Повторите новый пароль</span>
        <input type="password" name="new_password2" autocomplete="new-password"></label>
    </div>
    <div id="loginError" class="login-error"></div>
    <button class="btn btn-primary login-submit" type="submit" id="loginSubmit">Войти</button>
    <p class="muted small" id="loginHint">Учётную запись выдаёт администратор. Сотрудники входят в <a href="../">приложение обучения</a>.</p>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i class="fas fa-utensils"></i><div><b>Южане</b><span>кабинет менеджера</span></div></div>
    <nav class="menu">
      <a href="#/" data-route="dashboard"><i class="fas fa-chart-pie"></i>Обзор</a>
      <a href="#/users" data-route="users"><i class="fas fa-users"></i>Сотрудники</a>
      <a href="#/results" data-route="results"><i class="fas fa-list-check"></i>Результаты</a>
      <div class="menu-label">Контент</div>
      <a href="#/content" data-route="content"><i class="fas fa-layer-group"></i>Блоки и тесты</a>
      <a href="#/refs" data-route="refs"><i class="fas fa-book-open"></i>Справочники</a>
      <div class="menu-label" data-admin-only>Система</div>
      <a href="#/settings" data-route="settings" data-admin-only><i class="fas fa-gear"></i>Настройки</a>
    </nav>
    <div class="sidebar-foot">
      <div class="me" id="me"></div>
      <div class="sidebar-actions">
        <button class="icon-btn" id="themeBtn" title="Тема"><i class="fas fa-moon"></i></button>
        <button class="icon-btn" id="passwordBtn" title="Сменить пароль"><i class="fas fa-key"></i></button>
        <button class="icon-btn" id="logoutBtn" title="Выйти"><i class="fas fa-arrow-right-from-bracket"></i></button>
      </div>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main">
    <div class="mobile-bar">
      <button class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      <b>Южане · кабинет</b>
      <span style="width:38px"></span>
    </div>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="../config.js?v=202611061323" defer></script>
<script src="admin.js?v=202611061323" defer></script>
</body>
</html>
